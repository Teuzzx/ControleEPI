org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compilacao incremental do Kotlin desligada de proposito.
# Ela mantem indices .tab que, no Windows, se corrompem com caminho
# contendo espaco (F:\CONTROLE EPI) e com qualquer interrupcao do daemon
# do Gradle -- o build falha com "Could not close incremental caches".
# Custa alguns segundos a mais por build; a confiabilidade importa mais,
# porque o APK so publica se o build terminar.
kotlin.incremental=false
